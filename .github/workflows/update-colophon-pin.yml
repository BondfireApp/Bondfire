name: Update Colophon Pin

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-colophon-pin.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: npm

      - name: Update Colophon pin and regression expectation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const oldSha = 'da184cbcc83c1d4cdd16939d2728f6b0889ffa01'
          const newSha = '639561cd7a56d6c6d410767b43c0f0f4a28442eb'
          for (const file of ['package.json', 'scripts/product-reliability-regression.mjs']) {
            const before = fs.readFileSync(file, 'utf8')
            if (!before.includes(oldSha)) throw new Error(`${file} does not contain expected old Colophon pin`)
            fs.writeFileSync(file, before.split(oldSha).join(newSha))
          }
          NODE

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci

      - name: Run product reliability checks
        run: npm run test:product-reliability

      - name: Build production bundle
        run: npm run build

      - name: Commit updated pin
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json scripts/product-reliability-regression.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Pin Colophon trash UI reconciliation'
          git push origin HEAD:main
