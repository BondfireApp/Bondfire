name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run desktop:dist:win
            artifact: release/*.exe

          - name: macOS
            os: macos-latest
            command: npm run desktop:dist:mac
            artifact: |
              release/*.dmg
              release/*.zip

          - name: Linux
            os: ubuntu-latest
            command: npm run desktop:dist:linux
            artifact: |
              release/*.AppImage
              release/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop application
        run: ${{ matrix.command }}

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: Bondfire-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
