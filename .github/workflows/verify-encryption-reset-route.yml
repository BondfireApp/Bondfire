name: Verify encryption reset route

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-encryption-reset-route.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run encryption reset regression
        run: node scripts/private-encryption-reset-regression.mjs
      - name: Run product reliability checks
        run: npm run test:product-reliability
      - name: Build production bundle
        run: npm run build
