name: Validate Public Colophon Routing

on:
  push:
    branches:
      - fix/public-colophon-routing
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full regression suite
        run: npm test

      - name: Build production web app
        run: npm run build
